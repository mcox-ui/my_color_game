<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Great RGB Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <header>
            <h1>
                The Great
                <br>
                <span id="colorDisplay">rgb(255, 255, 255)</span>
                <br>
                Guessing Game
            </h1>
        </header>

        <nav id="stripe" aria-label="Controles del juego">
            <button id="reset" type="button">
                nuevos colores
            </button>

            <span id="message" aria-live="polite">Lorem, ipsum dolor.</span>

            <section class="difficulty-buttons" aria-label="Opciones de dificultad">

                <button class="selected" id="hard" type="button">
                    hard
                </button>

                <button id="easy" type="button">
                    easy
                </button>

            </section>
        </nav>

        <section class="container" aria-label="Opciones de colores">
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
        </section>
    </main>

    <script src="color_game.js"></script>
</body>

</html>
